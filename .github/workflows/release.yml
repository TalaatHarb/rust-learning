name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build release binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build api and executor (release)
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          stage_dir="rust-learning-${version}-${{ matrix.target }}"
          mkdir -p "${stage_dir}"
          cp "target/${{ matrix.target }}/release/api" "${stage_dir}/"
          cp "target/${{ matrix.target }}/release/executor" "${stage_dir}/"
          cp -r content "${stage_dir}/content"
          tar -czf "${stage_dir}.tar.gz" "${stage_dir}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-learning-${{ matrix.target }}
          path: rust-learning-*.tar.gz
          if-no-files-found: error

  build-windows-binaries:
    name: Build Windows release binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build API and executor
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc

      - name: Package binaries
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $stageDir = "rust-learning-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item -Path @(
            "target/x86_64-pc-windows-msvc/release/api.exe",
            "target/x86_64-pc-windows-msvc/release/executor.exe"
          ) -Destination $stageDir
          Copy-Item content "$stageDir/content" -Recurse
          Compress-Archive -Path "$stageDir/*" -DestinationPath "$stageDir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-learning-x86_64-pc-windows-msvc
          path: rust-learning-*.zip
          if-no-files-found: error

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build web app
        run: npm run web:build

      - name: Package web build
        run: |
          set -euo pipefail
          tar -czf "rust-learning-web-${GITHUB_REF_NAME}.tar.gz" -C apps/web dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-learning-web
          path: rust-learning-web-*.tar.gz
          if-no-files-found: error

  build-executor-image:
    name: Build and push executor image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/executor/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/executor:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.repository }}/executor:latest

  build-api-image:
    name: Build and push API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.repository }}/api:latest

  build-web-image:
    name: Build and push web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/web:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.repository }}/web:latest

  release:
    name: Publish GitHub release
    needs: [build-binaries, build-windows-binaries, build-web, build-api-image, build-executor-image, build-web-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: rust-learning-*
          path: dist

      - name: Flatten artifact directory
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
