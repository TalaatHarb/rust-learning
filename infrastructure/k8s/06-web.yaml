apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: rust-learning
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/talaatharb/rust-learning/web:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: VITE_API_BASE_URL
              value: "https://rust-api.NEXTECHINCUBATOR.COM"
            - name: VITE_OIDC_AUTHORITY
              value: "https://uaa.NEXTECHINCUBATOR.COM/realms/nextechincubator"
            - name: VITE_OIDC_CLIENT_ID
              value: "rust-learning-web"
            - name: VITE_OIDC_REDIRECT_URI
              value: "https://rust.NEXTECHINCUBATOR.COM"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: rust-learning
  labels:
    app: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  namespace: rust-learning
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rust.NEXTECHINCUBATOR.COM
      secretName: rust-web-tls-secret
  rules:
    - host: rust.NEXTECHINCUBATOR.COM
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
