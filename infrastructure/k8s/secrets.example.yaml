# Secret template for PostgreSQL
# Place actual secrets in this directory or apply directly to the cluster
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: rust-learning
type: Opaque
stringData:
  POSTGRES_USER: rust_learning
  POSTGRES_PASSWORD: "CHANGE_ME_PASSWORD"
  POSTGRES_DB: rust_learning
  DATABASE_URL: "postgres://rust_learning:CHANGE_ME_PASSWORD@postgres.rust-learning.svc.cluster.local:5432/rust_learning"
---
# Secret template for Keycloak / UAA admin credentials
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: rust-learning
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
  KC_DB_USERNAME: rust_learning
  KC_DB_PASSWORD: "CHANGE_ME_PASSWORD"
